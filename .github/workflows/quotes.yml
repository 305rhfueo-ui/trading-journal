name: 보유 종목 · QQQ 시세 갱신

on:
  push:
    branches: ["main"]
    paths: ["trades.json"]
  schedule:
    - cron: "50 21 * * *" # 21:50 UTC = 06:50 KST, 미국 장 마감 정산 후 (RS_Investment 와 같은 시각)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-quotes.js
      - name: 바뀐 경우만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet -- prices.json || (git commit -m "가격 갱신 $(date -u +%F)" && git push)
